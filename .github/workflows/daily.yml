name: Library Alert

on:
  workflow_dispatch:
    inputs:
      library:
        description: "selects which library API to call based off of registration times"
        required: true
        type: string 


jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run script
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          TEXTBEE_API_KEY: ${{ secrets.TEXTBEE_API_KEY }}
          TEXTBEE_DEVICE_ID: ${{ secrets.TEXTBEE_DEVICE_ID }}
          LIBRARY: ${{ inputs.library }}
        run: python main.py